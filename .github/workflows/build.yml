name: Build JVC Controller APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Generate Android Project & JVC Logo Icon
        run: |
          mkdir -p app/src/main/java/com/example/jvccontroller
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JvcController"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.jvccontroller'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.jvccontroller"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-JVC-Logo"
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.14'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.activity:activity-compose:1.9.0'
              implementation platform('androidx.compose:compose-bom:2024.06.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
          }
          EOF

          # Фон адаптивной иконки (глубокий карбоновый черный с темно-синим центром)
          cat << 'EOF' > app/src/main/res/drawable/ic_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080B10" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#111924" android:pathData="M12,54a42,42 0 1,0 84,0a42,42 0 1,0 -84,0"/>
          </vector>
          EOF

          # Передний план иконки: Неоновое кольцо + Фирменный логотип JVC + Линия DSP
          cat << 'EOF' > app/src/main/res/drawable/ic_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Внешнее неоновое кольцо в стиле подсветки магнитолы -->
              <path
                  android:strokeColor="#29B6F6"
                  android:strokeWidth="2.8"
                  android:fillColor="#00000000"
                  android:pathData="M18,54a36,36 0 1,0 72,0a36,36 0 1,0 -72,0"/>
              <!-- Внутреннее тонкое акцентное кольцо -->
              <path
                  android:strokeColor="#1E88E5"
                  android:strokeWidth="1.0"
                  android:fillColor="#00000000"
                  android:pathData="M21,54a33,33 0 1,0 66,0a33,33 0 1,0 -66,0"/>

              <!-- БУКВА J (фирменный красный цвет JVC) -->
              <path
                  android:fillColor="#FF1744"
                  android:pathData="M35,39 L41,39 L41,60 C41,64.5 38.2,67 33.5,67 L28.5,67 C24.2,67 22,64.5 22,60 L22,55 L28,55 L28,59.5 C28,60.8 28.8,61.5 30.2,61.5 L32.8,61.5 C34.2,61.5 35,60.8 35,59.5 Z"/>

              <!-- БУКВА V (фирменный красный цвет JVC) -->
              <path
                  android:fillColor="#FF1744"
                  android:pathData="M43,39 L49.2,39 L54,58.5 L58.8,39 L65,39 L57.2,67 L50.8,67 Z"/>

              <!-- БУКВА C (фирменный красный цвет JVC) -->
              <path
                  android:fillColor="#FF1744"
                  android:pathData="M86,48.5 L80,48.5 L80,45.5 C80,44.2 79.2,43.5 77.5,43.5 L73.5,43.5 C71.8,43.5 71,44.2 71,45.5 L71,60.5 C71,61.8 71.8,62.5 73.5,62.5 L77.5,62.5 C79.2,62.5 80,61.8 80,60.5 L80,57.5 L86,57.5 L86,61.5 C86,65 83.5,67 78.5,67 L72.5,67 C67.5,67 65,65 65,61.5 L65,44.5 C65,41 67.5,39 72.5,39 L78.5,39 C83.5,39 86,41 86,44.5 Z"/>

              <!-- Нижний декоративный индикатор эквалайзера под логотипом JVC -->
              <path android:fillColor="#29B6F6" android:pathData="M32,72 h44 v2.5 h-44 z"/>
              <path android:fillColor="#00E676" android:pathData="M44,72 h20 v2.5 h-20 z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="JVC KD-X33MBT"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/jvccontroller/MainActivity.kt
          @file:OptIn(ExperimentalMaterial3Api::class)
          package com.example.jvccontroller

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothSocket
          import android.content.Context
          import android.content.pm.PackageManager
          import android.hardware.usb.UsbDeviceConnection
          import android.hardware.usb.UsbManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.io.OutputStream
          import java.util.UUID
          import kotlin.math.roundToInt

          fun pkt(vararg b: Int): ByteArray = ByteArray(b.size) { b[it].toByte() }

          class JvcState {
              var subOn by mutableStateOf(true)
              var subLvl by mutableFloatStateOf(0f)
              var fader by mutableFloatStateOf(0f)
              var balance by mutableFloatStateOf(0f)
              var bassBoost by mutableIntStateOf(0)
              var loudness by mutableIntStateOf(0)
              var k2Tech by mutableStateOf(true)

              var is3Way by mutableStateOf(false)
              var twFrq by mutableFloatStateOf(3f)
              var twGain by mutableFloatStateOf(0f)
              var fHpf by mutableFloatStateOf(6f)
              var fSlope by mutableIntStateOf(1)
              var fGain by mutableFloatStateOf(0f)
              var rHpf by mutableFloatStateOf(6f)
              var rSlope by mutableIntStateOf(1)
              var rGain by mutableFloatStateOf(0f)
              var swLpf by mutableFloatStateOf(6f)
              var swSlope by mutableIntStateOf(2)
              var swPhaseRev by mutableStateOf(false)
              var swGain by mutableFloatStateOf(0f)

              val eq = mutableStateListOf(*Array(13) { 0f })
              var bassExt by mutableStateOf(false)
              var qIdx by mutableIntStateOf(0)
              val dtaCm = mutableStateListOf(0f, 0f, 0f, 0f, 0f)

              var dimmerAuto by mutableStateOf(true)
              var brightDay by mutableFloatStateOf(31f)
              var brightNight by mutableFloatStateOf(12f)
              var scrollOnce by mutableStateOf(true)
              var demoOff by mutableStateOf(true)
              var keyBeep by mutableStateOf(true)
              var srcAux by mutableStateOf(true)
              var srcAm by mutableStateOf(false)

              // 1. Функция сброса для окна "Сцена & Пресеты"
              fun resetSceneAndBass() {
                  subOn = true
                  subLvl = 0f
                  fader = 0f
                  balance = 0f
                  bassBoost = 0
                  loudness = 0
                  k2Tech = true
              }

              // 2. Функция сброса для окна "Кроссовер"
              fun resetCrossover() {
                  is3Way = false
                  twFrq = 3f
                  twGain = 0f
                  fHpf = 6f
                  fSlope = 1
                  fGain = 0f
                  rHpf = 6f
                  rSlope = 1
                  rGain = 0f
                  swLpf = 6f
                  swSlope = 2
                  swPhaseRev = false
                  swGain = 0f
              }

              // 3. Функция сброса для окна "Графический EQ"
              fun resetEqualizer() {
                  for (i in 0..12) eq[i] = 0f
                  bassExt = false
                  qIdx = 0
              }

              // 4. Функция сброса для окна "Задержки (DTA)"
              fun resetDta() {
                  for (i in 0..4) dtaCm[i] = 0f
              }

              // 5. Функция сброса для вкладки "Настройки магнитолы"
              fun resetSystem() {
                  dimmerAuto = true
                  brightDay = 31f
                  brightNight = 12f
                  scrollOnce = true
                  demoOff = true
                  keyBeep = true
                  srcAux = true
                  srcAm = false
              }

              fun toJson(): String = JSONObject().apply {
                  put("subOn", subOn); put("subLvl", subLvl.toDouble())
                  put("fader", fader.toDouble()); put("balance", balance.toDouble())
                  put("bassBoost", bassBoost); put("loudness", loudness); put("k2Tech", k2Tech)
                  put("is3Way", is3Way); put("twFrq", twFrq.toDouble()); put("twGain", twGain.toDouble())
                  put("fHpf", fHpf.toDouble()); put("fSlope", fSlope); put("fGain", fGain.toDouble())
                  put("rHpf", rHpf.toDouble()); put("rSlope", rSlope); put("rGain", rGain.toDouble())
                  put("swLpf", swLpf.toDouble()); put("swSlope", swSlope)
                  put("swPhaseRev", swPhaseRev); put("swGain", swGain.toDouble())
                  put("bassExt", bassExt); put("qIdx", qIdx)
                  put("dimmerAuto", dimmerAuto); put("brightDay", brightDay.toDouble())
                  put("brightNight", brightNight.toDouble()); put("scrollOnce", scrollOnce)
                  put("demoOff", demoOff); put("keyBeep", keyBeep)
                  put("srcAux", srcAux); put("srcAm", srcAm)
                  put("eq", JSONArray().also { a -> eq.forEach { a.put(it.toDouble()) } })
                  put("dta", JSONArray().also { a -> dtaCm.forEach { a.put(it.toDouble()) } })
              }.toString()

              fun fromJson(s: String) {
                  val j = JSONObject(s)
                  subOn = j.optBoolean("subOn", true); subLvl = j.optDouble("subLvl", 0.0).toFloat()
                  fader = j.optDouble("fader", 0.0).toFloat(); balance = j.optDouble("balance", 0.0).toFloat()
                  bassBoost = j.optInt("bassBoost", 0); loudness = j.optInt("loudness", 0)
                  k2Tech = j.optBoolean("k2Tech", true); is3Way = j.optBoolean("is3Way", false)
                  twFrq = j.optDouble("twFrq", 3.0).toFloat(); twGain = j.optDouble("twGain", 0.0).toFloat()
                  fHpf = j.optDouble("fHpf", 6.0).toFloat(); fSlope = j.optInt("fSlope", 1)
                  fGain = j.optDouble("fGain", 0.0).toFloat(); rHpf = j.optDouble("rHpf", 6.0).toFloat()
                  rSlope = j.optInt("rSlope", 1); rGain = j.optDouble("rGain", 0.0).toFloat()
                  swLpf = j.optDouble("swLpf", 6.0).toFloat(); swSlope = j.optInt("swSlope", 2)
                  swPhaseRev = j.optBoolean("swPhaseRev", false); swGain = j.optDouble("swGain", 0.0).toFloat()
                  bassExt = j.optBoolean("bassExt", false); qIdx = j.optInt("qIdx", 0)
                  dimmerAuto = j.optBoolean("dimmerAuto", true)
                  brightDay = j.optDouble("brightDay", 31.0).toFloat()
                  brightNight = j.optDouble("brightNight", 12.0).toFloat()
                  scrollOnce = j.optBoolean("scrollOnce", true)
                  demoOff = j.optBoolean("demoOff", true); keyBeep = j.optBoolean("keyBeep", true)
                  srcAux = j.optBoolean("srcAux", true); srcAm = j.optBoolean("srcAm", false)
                  j.optJSONArray("eq")?.let { a -> for (i in 0 until minOf(13, a.length())) eq[i] = a.getDouble(i).toFloat() }
                  j.optJSONArray("dta")?.let { a -> for (i in 0 until minOf(5, a.length())) dtaCm[i] = a.getDouble(i).toFloat() }
              }
          }

          class JvcConn(val ctx: Context) {
              private val sppUuid = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")
              private var btSocket: BluetoothSocket? = null
              private var btOut: OutputStream? = null
              private var usbConn: UsbDeviceConnection? = null
              private val prefs = ctx.getSharedPreferences("JvcPresets", Context.MODE_PRIVATE)

              var mode by mutableStateOf("NONE")
              var status by mutableStateOf("Автономный режим (визуализация активна)")

              @SuppressLint("MissingPermission")
              fun pairedDevices() = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S &&
                  ContextCompat.checkSelfPermission(ctx, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED
              ) emptyList() else (ctx.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter?.bondedDevices?.toList() ?: emptyList()

              @SuppressLint("MissingPermission")
              fun connectBt(name: String, addr: String) {
                  status = "Подключение по BT к $name..."
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          disconnect()
                          val dev = (ctx.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter.getRemoteDevice(addr)
                          val sock = dev.createRfcommSocketToServiceRecord(sppUuid)
                          sock.connect()
                          btSocket = sock; btOut = sock.outputStream
                          withContext(Dispatchers.Main) { mode = "BT"; status = "Подключено по BT: $name" }
                      } catch (e: IOException) {
                          withContext(Dispatchers.Main) { mode = "NONE"; status = "BT недоступен (работаем с пресетами)" }
                      }
                  }
              }

              fun connectUsb() {
                  val um = ctx.getSystemService(Context.USB_SERVICE) as UsbManager
                  val dev = um.deviceList.values.firstOrNull()
                  if (dev == null) {
                      status = "USB-устройство не найдено (проверьте кабель)"
                      Toast.makeText(ctx, "Магнитола по USB не найдена", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (um.hasPermission(dev)) {
                      usbConn = um.openDevice(dev)
                      mode = if (usbConn != null) "USB" else "NONE"
                      status = if (usbConn != null) "Подключено по USB: ${dev.productName ?: "JVC"}" else "Ошибка открытия USB"
                  } else status = "Переподключите USB-кабель и разрешите доступ"
              }

              fun send(cmd: String, bytes: ByteArray) {
                  if (mode == "BT") CoroutineScope(Dispatchers.IO).launch {
                      try { btOut?.write(bytes); btOut?.flush() } catch (_: IOException) {
                          withContext(Dispatchers.Main) { mode = "NONE"; status = "Связь BT прервалась" }
                      }
                  } else if (mode == "USB") CoroutineScope(Dispatchers.IO).launch {
                      usbConn?.controlTransfer(0x40, 0x01, 0, 0, bytes, bytes.size, 500)
                  }
              }

              fun notifyReset(sectionName: String) {
                  Toast.makeText(ctx, "Сброшены настройки: $sectionName", Toast.LENGTH_SHORT).show()
              }

              fun disconnect() {
                  try { btSocket?.close(); usbConn?.close() } catch (_: Exception) {}
                  mode = "NONE"; status = "Отключено"
              }

              fun savePreset(slot: Int, st: JvcState) {
                  prefs.edit().putString("slot_$slot", st.toJson()).apply()
                  Toast.makeText(ctx, "Пресет $slot сохранен!", Toast.LENGTH_SHORT).show()
              }

              fun loadPreset(slot: Int, st: JvcState) {
                  val s = prefs.getString("slot_$slot", null)
                  if (s != null) { st.fromJson(s); Toast.makeText(ctx, "Пресет $slot загружен!", Toast.LENGTH_SHORT).show() }
                  else Toast.makeText(ctx, "Слот $slot пока пуст", Toast.LENGTH_SHORT).show()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Color(0xFF29B6F6),
                              secondary = Color(0xFFFF1744),
                              background = Color(0xFF0B0E14),
                              surface = Color(0xFF161B24)
                          )
                      ) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              JvcMainApp()
                          }
                      }
                  }
              }
          }

          @SuppressLint("MissingPermission")
          @Composable
          fun JvcMainApp() {
              val ctx = LocalContext.current
              val conn = remember { JvcConn(ctx) }
              val st = remember { JvcState() }
              var showBtDialog by remember { mutableStateOf(false) }
              var mainTab by remember { mutableIntStateOf(0) }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {}
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      permLauncher.launch(arrayOf(Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN))
                  }
              }

              Column(modifier = Modifier.fillMaxSize().systemBarsPadding()) {
                  Card(
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(12.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  // Фирменный бейдж JVC в шапке приложения
                                  Box(
                                      modifier = Modifier
                                          .background(Color(0xFFFF1744), RoundedCornerShape(6.dp))
                                          .padding(horizontal = 8.dp, vertical = 4.dp)
                                  ) {
                                      Text("JVC", color = Color.White, fontWeight = FontWeight.ExtraBold, fontSize = 15.sp)
                                  }
                                  Spacer(Modifier.width(10.dp))
                                  Column {
                                      Text("KD-X33MBT Visual DSP", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                      Text(conn.status, fontSize = 11.sp, color = if (conn.mode != "NONE") Color(0xFF00E676) else Color.LightGray)
                                  }
                              }
                              if (conn.mode != "NONE") OutlinedButton(onClick = { conn.disconnect() }) { Text("Откл.") }
                          }
                          if (conn.mode == "NONE") {
                              Spacer(Modifier.height(6.dp))
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(onClick = { showBtDialog = true }, modifier = Modifier.weight(1f)) { Text("Подключить BT") }
                                  OutlinedButton(onClick = { conn.connectUsb() }, modifier = Modifier.weight(1f)) { Text("Подключить USB") }
                              }
                          }
                      }
                  }

                  TabRow(selectedTabIndex = mainTab, containerColor = MaterialTheme.colorScheme.surface) {
                      listOf("1. Настройки звука", "2. Настройки магнитолы").forEachIndexed { i, t ->
                          Tab(selected = mainTab == i, onClick = { mainTab = i }, text = { Text(t, fontWeight = FontWeight.Bold) })
                      }
                  }

                  Box(modifier = Modifier.fillMaxSize().padding(10.dp)) {
                      if (mainTab == 0) SoundTab(conn, st) else SystemTab(conn, st)
                  }
              }

              if (showBtDialog) {
                  val devs = conn.pairedDevices()
                  AlertDialog(
                      onDismissRequest = { showBtDialog = false },
                      title = { Text("Выберите магнитолу JVC") },
                      text = {
                          if (devs.isEmpty()) Text("Нет сопряженных устройств. Подключите магнитолу в настройках Bluetooth телефона.")
                          else LazyColumn {
                              items(devs.size) { i ->
                                  val d = devs[i]
