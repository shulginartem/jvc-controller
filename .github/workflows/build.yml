          @Composable
          fun CarCabinVisualizer(st: JvcState, conn: JvcConn) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text("Сенсорная карта салона (двигайте точку сцены пальцем)", fontSize = 11.sp, color = Color.LightGray)
                  Spacer(Modifier.height(6.dp))
                  Canvas(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(190.dp)
                          .background(Color(0xFF0D1117), RoundedCornerShape(12.dp))
                          .border(1.dp, Color(0xFF263238), RoundedCornerShape(12.dp))
                          .pointerInput(Unit) {
                              detectDragGestures { change, _ ->
                                  val nx = ((change.position.x / size.width) * 30f - 15f).coerceIn(-15f, 15f)
                                  val ny = ((1f - (change.position.y / size.height)) * 30f - 15f).coerceIn(-15f, 15f)
                                  st.balance = nx
                                  st.fader = ny
                                  conn.send("BAL_FAD", pkt(0x03, ny.roundToInt(), nx.roundToInt()))
                              }
                          }
                  ) {
                      val w = size.width
                      val h = size.height
                      val carLeft = w * 0.22f
                      val carRight = w * 0.78f
                      val carWidth = carRight - carLeft

                      drawRoundRect(
                          color = Color(0xFF1C2533),
                          topLeft = Offset(carLeft, h * 0.06f),
                          size = Size(carWidth, h * 0.88f),
                          cornerRadius = CornerRadius(32f, 32f)
                      )
                      drawRoundRect(
                          color = Color(0xFF37474F),
                          topLeft = Offset(carLeft, h * 0.06f),
                          size = Size(carWidth, h * 0.88f),
                          cornerRadius = CornerRadius(32f, 32f),
                          style = Stroke(width = 3f)
                      )

                      drawCircle(Color(0xFF29B6F6), radius = 10f, center = Offset(carLeft + 18f, h * 0.16f))
                      drawCircle(Color(0xFF29B6F6), radius = 10f, center = Offset(carRight - 18f, h * 0.16f))
                      drawCircle(Color(0xFF00E676), radius = 11f, center = Offset(carLeft + 22f, h * 0.72f))
                      drawCircle(Color(0xFF00E676), radius = 11f, center = Offset(carRight - 22f, h * 0.72f))

                      val subCenter = Offset(w * 0.5f, h * 0.85f)
                      drawRoundRect(
                          color = if (st.subOn) Color(0xFFFF1744) else Color.DarkGray,
                          topLeft = Offset(w * 0.42f, h * 0.79f),
                          size = Size(w * 0.16f, h * 0.11f),
                          cornerRadius = CornerRadius(8f, 8f)
                      )
                      if (st.subOn) {
                          val power = ((st.subLvl + 50f) / 60f).coerceIn(0.1f, 1f) + (st.bassBoost * 0.08f)
                          for (ring in 1..3) {
                              drawCircle(
                                  color = Color(0xFFFF1744).copy(alpha = (0.35f / ring) * power),
                                  radius = 22f * ring * power,
                                  center = subCenter,
                                  style = Stroke(width = 3f)
                              )
                          }
                      }

                      val fx = carLeft + ((st.balance + 15f) / 30f) * carWidth
                      val fy = (h * 0.72f) - ((st.fader + 15f) / 30f) * (h * 0.54f)

                      drawCircle(Color(0xFF00E5FF).copy(alpha = 0.22f), radius = 34f, center = Offset(fx, fy))
                      drawLine(Color(0xFF00E5FF).copy(alpha = 0.5f), Offset(carLeft, fy), Offset(carRight, fy), strokeWidth = 1.5f)
                      drawLine(Color(0xFF00E5FF).copy(alpha = 0.5f), Offset(fx, h * 0.1f), Offset(fx, h * 0.8f), strokeWidth = 1.5f)
                      drawCircle(Color(0xFF00E676), radius = 11f, center = Offset(fx, fy))
                  }
              }
          }

          @Composable
          fun CrossoverGraphVisualizer(st: JvcState) {
              Column {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text("Красный: Саб", fontSize = 11.sp, color = Color(0xFFFF1744))
                      Text("Голубой: Фронт", fontSize = 11.sp, color = Color(0xFF29B6F6))
                      if (!st.is3Way) Text("Зеленый: Тыл", fontSize = 11.sp, color = Color(0xFF00E676))
                      Text("Золотой: ВЧ", fontSize = 11.sp, color = Color(0xFFFFAB00))
                  }
                  Spacer(Modifier.height(4.dp))
                  Canvas(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(160.dp)
                          .background(Color(0xFF0D1117), RoundedCornerShape(12.dp))
                          .border(1.dp, Color(0xFF263238), RoundedCornerShape(12.dp))
                  ) {
                      val w = size.width
                      val h = size.height

                      for (i in 1..3) {
                          val y = h * (i / 4f)
                          drawLine(Color(0xFF1E293B), Offset(0f, y), Offset(w, y), strokeWidth = 1f)
                      }

                      val subCutX = (w * 0.08f) + (st.swLpf / 13f) * (w * 0.35f)
                      val subTopY = h * 0.25f - (st.swGain / 8f) * (h * 0.2f)
                      val subSlopeDrop = (w * 0.22f) / (st.swSlope + 1)
                      val subPath = Path().apply {
                          moveTo(0f, subTopY)
                          lineTo(subCutX, subTopY)
                          lineTo(subCutX + subSlopeDrop, h)
                      }
                      drawPath(subPath, Color(0xFFFF1744), style = Stroke(width = 4f))

                      val fCutX = (w * 0.12f) + (st.fHpf / 13f) * (w * 0.35f)
                      val fTopY = h * 0.25f - (st.fGain / 8f) * (h * 0.2f)
                      val fSlopeSpan = (w * 0.22f) / (st.fSlope + 1)
                      val fPath = Path().apply {
                          moveTo(if (st.fHpf == 0f) 0f else (fCutX - fSlopeSpan).coerceAtLeast(0f), if (st.fHpf == 0f) fTopY else h)
                          lineTo(fCutX, fTopY)
                          lineTo(w * 0.78f, fTopY)
                      }
                      drawPath(fPath, Color(0xFF29B6F6), style = Stroke(width = 4f))

                      if (!st.is3Way) {
                          val rCutX = (w * 0.12f) + (st.rHpf / 13f) * (w * 0.35f)
                          val rTopY = h * 0.30f - (st.rGain / 8f) * (h * 0.2f)
                          val rSlopeSpan = (w * 0.22f) / (st.rSlope + 1)
                          val rPath = Path().apply {
                              moveTo(if (st.rHpf == 0f) 0f else (rCutX - rSlopeSpan).coerceAtLeast(0f), if (st.rHpf == 0f) rTopY else h)
                              lineTo(rCutX, rTopY)
                              lineTo(w * 0.72f, rTopY)
                          }
                          drawPath(rPath, Color(0xFF00E676).copy(alpha = 0.8f), style = Stroke(width = 3f))
                      }

                      val twCutX = (w * 0.55f) + (st.twFrq / 8f) * (w * 0.35f)
                      val twTopY = h * 0.25f - (st.twGain / 8f) * (h * 0.2f)
                      val twPath = Path().apply {
                          moveTo(twCutX - w * 0.1f, h)
                          lineTo(twCutX, twTopY)
                          lineTo(w, twTopY)
                      }
                      drawPath(twPath, Color(0xFFFFAB00), style = Stroke(width = 4f))
                  }
              }
          }

          @Composable
          fun GraphicEqualizerVisualizer(st: JvcState, conn: JvcConn) {
              Column {
                  Text("Проведите пальцем по графику для рисования кривой эквалайзера:", fontSize = 11.sp, color = Color.LightGray)
                  Spacer(Modifier.height(6.dp))
                  Canvas(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(200.dp)
                          .background(Color(0xFF0D1117), RoundedCornerShape(12.dp))
                          .border(1.dp, Color(0xFF263238), RoundedCornerShape(12.dp))
                          .pointerInput(Unit) {
                              detectDragGestures { change, _ ->
                                  val band = ((change.position.x / size.width) * 13).toInt().coerceIn(0, 12)
                                  val db = ((0.5f - (change.position.y / size.height)) * 18f).coerceIn(-9f, 9f)
                                  st.eq[band] = db.roundToInt().toFloat()
                                  conn.send("EQ_$band", pkt(0x20, band, db.roundToInt()))
                              }
                          }
                          .pointerInput(Unit) {
                              detectTapGestures { offset ->
                                  val band = ((offset.x / size.width) * 13).toInt().coerceIn(0, 12)
                                  val db = ((0.5f - (offset.y / size.height)) * 18f).coerceIn(-9f, 9f)
                                  st.eq[band] = db.roundToInt().toFloat()
                                  conn.send("EQ_$band", pkt(0x20, band, db.roundToInt()))
                              }
                          }
                  ) {
                      val w = size.width
                      val h = size.height
                      val midY = h * 0.5f
                      val colW = w / 13f

                      drawLine(Color(0xFF37474F), Offset(0f, midY), Offset(w, midY), strokeWidth = 2f)

                      val curvePath = Path()
                      val fillPath = Path()

                      for (i in 0..12) {
                          val cx = colW * i + colW * 0.5f
                          val cy = midY - (st.eq[i] / 9f) * (h * 0.42f)

                          val barTop = minOf(midY, cy)
                          val barH = kotlin.math.abs(cy - midY).coerceAtLeast(4f)
                          val barColor = if (i < 3 && st.bassExt) Color(0xFFFF1744) else Color(0xFF29B6F6)

                          drawRoundRect(
                              color = barColor.copy(alpha = 0.35f),
                              topLeft = Offset(cx - colW * 0.28f, barTop),
                              size = Size(colW * 0.56f, barH),
                              cornerRadius = CornerRadius(6f, 6f)
                          )

                          if (i == 0) {
                              curvePath.moveTo(cx, cy)
                              fillPath.moveTo(cx, h)
                              fillPath.lineTo(cx, cy)
                          } else {
                              curvePath.lineTo(cx, cy)
                              fillPath.lineTo(cx, cy)
                          }
                          if (i == 12) fillPath.lineTo(cx, h)
                      }
                      fillPath.close()

                      drawPath(
                          path = fillPath,
                          brush = Brush.verticalGradient(
                              colors = listOf(Color(0xFF29B6F6).copy(alpha = 0.35f), Color.Transparent)
                          )
                      )

                      val strokeW = (5f - st.qIdx * 1.2f).coerceAtLeast(2.5f)
                      drawPath(curvePath, Color(0xFF00E5FF), style = Stroke(width = strokeW))

                      for (i in 0..12) {
                          val cx = colW * i + colW * 0.5f
                          val cy = midY - (st.eq[i] / 9f) * (h * 0.42f)
                          drawCircle(Color(0xFF00E676), radius = 8f, center = Offset(cx, cy))
                      }
                  }
              }
          }

          @Composable
          fun DtaWavesVisualizer(st: JvcState) {
              Canvas(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(140.dp)
                      .background(Color(0xFF0D1117), RoundedCornerShape(12.dp))
                      .border(1.dp, Color(0xFF263238), RoundedCornerShape(12.dp))
              ) {
                  val w = size.width
                  val h = size.height
                  val driverHead = Offset(w * 0.36f, h * 0.38f)

                  val spkPositions = listOf(
                      Offset(w * 0.25f, h * 0.15f),
                      Offset(w * 0.75f, h * 0.15f),
                      Offset(w * 0.25f, h * 0.75f),
                      Offset(w * 0.75f, h * 0.75f),
                      Offset(w * 0.50f, h * 0.90f)
                  )

                  spkPositions.forEachIndexed { idx, pos ->
                      val norm = (st.dtaCm[idx] / 610f).coerceIn(0.05f, 1f)
                      drawLine(
                          color = Color(0xFF29B6F6).copy(alpha = 0.25f + norm * 0.5f),
                          start = pos,
                          end = driverHead,
                          strokeWidth = 2f + norm * 4f
                      )
                      drawCircle(Color(0xFF29B6F6), radius = 9f, center = pos)
                  }
                  drawCircle(Color(0xFF00E676).copy(alpha = 0.3f), radius = 22f, center = driverHead)
                  drawCircle(Color(0xFF00E676), radius = 10f, center = driverHead)
              }
          }

